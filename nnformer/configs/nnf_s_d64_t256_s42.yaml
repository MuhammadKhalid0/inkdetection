# 2026-07-20 nnFormer Phase N2 (nnformer_plan.md §5 N2): capacity x data
# density at t256. Labels REVERTED to ink_reg.npy (original UNETR++
# registration) per Omar's decision -- reg2 stays a documented, separate
# data-quality finding, not the model-comparison default.
# Base architecture NOT amended: n_embedz2's reg1 'win' (+0.012/+0.022)
# did not replicate under reg2 (-0.012/+0.007) -- treated as an
# unconfirmed, non-replicated screen result (the DA-EPA-seed42 lesson),
# so N2 uses the stock depth-preserving embed (1,4,4), unmodified.
# S capacity + dense stride-64 (presumptive 'best of S/M' pending confirmation; add nnf_m_d64 if M wins).
model:
  name: nnformer
  feature_size: 16
  capacity: S
  patch_size:
  - 1
  - 4
  - 4
  gv_bottleneck: true
  skip_attention: true
  drop_path: 0.1
  cssa: false
  sr_pb: false
shared:
  texture_stem: false
  collapse: surface_relative
data:
  tile: 256
  depth: 32
  center_layer: 32
  n_layers: 65
  normalize: 255.0
  label_file: ink_reg.npy
  manifest_suffix: _reg_t256_d64
  pos_thresh: 0.05
  samples_per_epoch: 4000
  aug:
    hflip: true
    vflip: true
    rot90: true
    z_flip: false
    z_flip_p: 0.5
    z_shift: 2
    z_shift_p: 0.3
  use_uncertainty: true
train:
  loss: dice_bce_masked
  lr: 0.0001
  weight_decay: 3.0e-05
  epochs: 60
  warmup_epochs: 3
  batch: 4
  num_workers: 8
  amp: true
  amp_dtype: bf16
  grad_clip: 1.0
  val_tau: 0.4
  select_on: sweep
  sweep_every: 1
  patience: 20
  seed: 42
infer:
  stride: 128
  batch: 4
output:
  dir: /home/woody/iwi5/iwi5401h/nnFormer/outputs
  run_name: nnf_s_d64_t256_s42
