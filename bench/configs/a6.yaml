# A6 — A2 with Tversky+BCE loss (F0.5-aligned arm).
# Tversky (alpha=0.7 > beta=0.3) penalises FALSE POSITIVES harder, matching F0.5's
# precision weighting; tests whether aligning the loss with the metric helps over
# the symmetric Dice+BCE. Identical architecture to A2 (surface-relative); ONLY the
# training loss changes. Methodology A6: "precision alignment with F0.5".
# Diff vs a2.yaml: train.loss tversky_bce (+ alpha/beta), run_name a6.

model:
  name: unetrpp
  feature_size: 16
  dims: [32, 64, 128, 256]
  depths: [3, 3, 3, 3]
  num_heads: 4
  patch_size: [1, 4, 4]
  pe_mode: 2d
  depth_attn: true
  da_gamma_init: 0.1
  surface_relative: true

shared:
  texture_stem: true
  stem_out_extra: 8
  collapse: surface_relative

data:
  tile: 64
  depth: 32
  center_layer: 32
  n_layers: 65
  normalize: 255.0
  pos_thresh: 0.05
  samples_per_epoch: 4000
  aug:
    hflip: true
    vflip: true
    rot90: true
    z_flip: true
    z_flip_p: 0.5
    z_shift: 2
    z_shift_p: 0.3

train:
  loss: tversky_bce
  tversky_alpha: 0.7
  tversky_beta: 0.3
  lr: 1.0e-4
  weight_decay: 3.0e-5
  epochs: 120
  warmup_epochs: 3
  batch: 16
  num_workers: 8
  amp: true
  grad_clip: 1.0
  val_tau: 0.4
  sweep_every: 5
  patience: 20
  seed: 42

infer:
  stride: 32
  batch: 32

output:
  dir: /home/woody/iwi5/iwi5401h/vesuvius/outputs
  run_name: a6
