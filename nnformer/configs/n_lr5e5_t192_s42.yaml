# 2026-07-20 nnFormer Phase N1 RETRAIN on re-registered labels (reg2 —
# rereg/summary.md): label_file=ink_reg2, manifests _reg2_t192, trimap
# unc_reg2 (r=4, no dy-widening). Same architecture toggle + recipe as the
# reg1 screen of the same name (deleted 2026-07-20 per Omar; two val maps
# archived in rereg/provenance/). Deltas read vs n_base on reg2 ONLY.
model:
  name: nnformer
  feature_size: 16
  capacity: S
  patch_size:
  - 1
  - 4
  - 4
  gv_bottleneck: true
  skip_attention: true
  drop_path: 0.1
  cssa: false
  sr_pb: false
shared:
  texture_stem: false
  collapse: surface_relative
data:
  tile: 192
  depth: 32
  center_layer: 32
  n_layers: 65
  normalize: 255.0
  label_file: ink_reg2.npy
  manifest_suffix: _reg2_t192
  pos_thresh: 0.05
  samples_per_epoch: 4000
  aug:
    hflip: true
    vflip: true
    rot90: true
    z_flip: false
    z_flip_p: 0.5
    z_shift: 2
    z_shift_p: 0.3
  use_uncertainty: true
  unc_file: unc_reg2.npy
train:
  loss: dice_bce_masked
  lr: 5.0e-05
  weight_decay: 3.0e-05
  epochs: 60
  warmup_epochs: 3
  batch: 4
  num_workers: 8
  amp: true
  amp_dtype: bf16
  grad_clip: 1.0
  val_tau: 0.4
  select_on: sweep
  sweep_every: 1
  patience: 20
  seed: 42
infer:
  stride: 96
  batch: 8
output:
  dir: /home/woody/iwi5/iwi5401h/nnFormer/outputs
  run_name: n_lr5e5_t192_s42
