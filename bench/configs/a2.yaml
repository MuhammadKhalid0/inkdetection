# A2 — A1 + surface-relative frame (makes depth attention AND collapse surface-relative).
# Targets the depth-OFFSET failure: a per-tile soft surface centre s_hat (anchored at
# centre) re-indexes both the depth-attention PE (r_d = d - s_hat) and the learned
# collapse (phi over r_d, Gaussian-init at r=0). Expected to help most on cross-segment.
# Diff vs a1.yaml: model.surface_relative true, shared.collapse surface_relative, run_name a2.

model:
  name: unetrpp
  feature_size: 16
  dims: [32, 64, 128, 256]
  depths: [3, 3, 3, 3]
  num_heads: 4
  patch_size: [1, 4, 4]
  pe_mode: 2d
  depth_attn: true
  da_gamma_init: 0.1
  surface_relative: true       # A2: relative depth PE (r_d = d - s_hat)

shared:
  texture_stem: true
  stem_out_extra: 8
  collapse: surface_relative    # A2: collapse re-indexed to the surface frame

data:
  tile: 64
  depth: 32
  center_layer: 32
  n_layers: 65
  normalize: 255.0
  pos_thresh: 0.05
  samples_per_epoch: 4000
  aug:
    hflip: true
    vflip: true
    rot90: true
    z_flip: true
    z_flip_p: 0.5
    z_shift: 2
    z_shift_p: 0.3

train:
  loss: dice_bce
  lr: 1.0e-4
  weight_decay: 3.0e-5
  epochs: 120
  warmup_epochs: 3
  batch: 16
  num_workers: 8
  amp: true
  grad_clip: 1.0
  val_tau: 0.4
  sweep_every: 5
  patience: 20
  seed: 42

infer:
  stride: 32
  batch: 32

output:
  dir: /home/woody/iwi5/iwi5401h/vesuvius/outputs
  run_name: a2
