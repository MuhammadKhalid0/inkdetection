# 2026-07-18 GEOMETRY CLOSING EXPERIMENT (plan 14.5): lean t192 + auxiliary
# self-supervision of the collapse s_hat toward the tile's smoothed intensity
# depth peak (label-free; the G2 probe's s_ref), weight 0.1.
# PRE-REGISTERED PREDICTIONS: (a) G2 fidelity r jumps 0.2 -> >0.8 (near-
# certain); (b) G1 stress curve flattens at |delta|>=6 vs the lean band
