# A2bs — A2b (per-pixel surface field) STABILIZED.
# A2b regressed in-distribution (0.517) because the per-pixel warp destabilizes
# from-scratch training: it peaked at e9 then precision collapsed as recall ran away.
# A2bs adds the two methodology-listed stabilizers (model.warp_stabilize true):
#   * learnable softmax TEMPERATURE on the per-pixel s_hat soft-argmax (EPA + collapse),
#     so the surface estimate is not brittle against multimodal depth profiles;
#   * BOUNDED warp: the per-pixel depth shift is passed through tanh so |shift| < H/4,
#     so the deformable z-sampling cannot run away and wreck training.
# Both are gated behind warp_stabilize -> the faithful A2b (run_name a2b) is unchanged.
# Diff vs a2b.yaml: model.warp_stabilize true, run_name a2bs.

model:
  name: unetrpp
  feature_size: 16
  dims: [32, 64, 128, 256]
  depths: [3, 3, 3, 3]
  num_heads: 4
  patch_size: [1, 4, 4]
  pe_mode: 2d
  depth_attn: true
  da_gamma_init: 0.1
  surface_relative: true
  per_pixel: true
  warp_stabilize: true          # A2bs: temperature + bounded (|shift|<H/4) warp

shared:
  texture_stem: true
  stem_out_extra: 8
  collapse: surface_relative

data:
  tile: 64
  depth: 32
  center_layer: 32
  n_layers: 65
  normalize: 255.0
  pos_thresh: 0.05
  samples_per_epoch: 4000
  aug:
    hflip: true
    vflip: true
    rot90: true
    z_flip: true
    z_flip_p: 0.5
    z_shift: 2
    z_shift_p: 0.3

train:
  loss: dice_bce
  lr: 1.0e-4
  weight_decay: 3.0e-5
  epochs: 120
  warmup_epochs: 3
  batch: 16
  num_workers: 8
  amp: true
  grad_clip: 1.0
  val_tau: 0.4
  sweep_every: 5
  patience: 20
  seed: 42

infer:
  stride: 32
  batch: 32

output:
  dir: /home/woody/iwi5/iwi5401h/vesuvius/outputs
  run_name: a2bs
