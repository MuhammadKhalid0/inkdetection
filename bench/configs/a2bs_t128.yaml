# A2bs_t128 — MOST AMBITIOUS: best architecture (a2bs per-pixel surface-relative,
# stabilized) x TILE 128 x registered labels x fixed training loop (2026-07-03).
# Combines every lever that helped or is physically motivated:
#   reg labels (+0.05 eval, +0.01 retrain) + sweep selection (+0.01-0.05) +
#   completed cosine + 4x in-plane context for letter-shape prior (left word).
# batch 8, infer stride 64. Same manifests as a1_t128 (_reg_t128).

model:
  name: unetrpp
  feature_size: 16
  dims: [32, 64, 128, 256]
  depths: [3, 3, 3, 3]
  num_heads: 4
  patch_size: [1, 4, 4]
  pe_mode: 2d
  depth_attn: true
  da_gamma_init: 0.1
  surface_relative: true
  per_pixel: true
  warp_stabilize: true

shared:
  texture_stem: true
  stem_out_extra: 8
  collapse: surface_relative

data:
  tile: 128
  depth: 32
  center_layer: 32
  n_layers: 65
  normalize: 255.0
  label_file: ink_reg.npy
  manifest_suffix: _reg_t128
  pos_thresh: 0.05
  samples_per_epoch: 4000
  aug:
    hflip: true
    vflip: true
    rot90: true
    z_flip: true
    z_flip_p: 0.5
    z_shift: 2
    z_shift_p: 0.3

train:
  loss: dice_bce
  lr: 1.0e-4
  weight_decay: 3.0e-5
  epochs: 60
  warmup_epochs: 3
  batch: 8
  num_workers: 8
  amp: true
  grad_clip: 1.0
  val_tau: 0.4
  select_on: sweep
  sweep_every: 1
  patience: 20
  seed: 42

infer:
  stride: 64
  batch: 16

output:
  dir: /home/woody/iwi5/iwi5401h/vesuvius/outputs
  run_name: a2bs_t128
