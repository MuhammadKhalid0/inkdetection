# 2026-08-13 PRIOR-ART cell (plan §2.4): GV-MSA bottleneck -> 3x vFFC residual
# blocks (Quattrini et al. 2023, arXiv:2308.05070). Completes the three-way
# bottleneck study {LV-only, GV-MSA, spectral conv} = does the MECHANISM CLASS
# of global context matter? Pre-registered expectation: neutral (plan pred. 5).
# CONFOUND (state in the thesis): vFFC lands ~65M params vs 20M stock because
# 3x3x3 convs at the 512-ch bottleneck are heavy. Tolerable because N2 measured
# nnFormer to be capacity-INSENSITIVE (S 19.9M / M 79.1M / F 178M all within
# +-0.008), so a param gap here does not explain a delta either way.
# torch.fft has no bf16 kernel -> ST-3D runs as an fp32 island (contrib.py).
model:
  name: nnformer
  feature_size: 16
  capacity: S
  patch_size:
  - 1
  - 4
  - 4
  gv_bottleneck: true
  skip_attention: true
  drop_path: 0.1
  cssa: false
  sr_pb: false
  vffc_bottleneck: true
shared:
  texture_stem: false
  collapse: surface_relative
data:
  tile: 192
  depth: 32
  center_layer: 32
  n_layers: 65
  normalize: 255.0
  label_file: ink_reg.npy
  manifest_suffix: _reg_t192
  pos_thresh: 0.05
  samples_per_epoch: 4000
  aug:
    hflip: true
    vflip: true
    rot90: true
    z_flip: false
    z_flip_p: 0.5
    z_shift: 2
    z_shift_p: 0.3
  use_uncertainty: true
train:
  loss: dice_bce_masked
  lr: 0.0001
  weight_decay: 3.0e-05
  epochs: 60
  warmup_epochs: 3
  batch: 4
  num_workers: 8
  amp: true
  amp_dtype: bf16
  grad_clip: 1.0
  val_tau: 0.4
  select_on: sweep
  sweep_every: 1
  patience: 20
  seed: 42
infer:
  stride: 96
  batch: 4
output:
  dir: /home/woody/iwi5/iwi5401h/nnFormer/outputs
  run_name: n_vffc_t192_r1_s42
